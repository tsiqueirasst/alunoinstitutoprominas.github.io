        /* Reset e Estilos Gerais */
        * {

        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Alinhado ao topo */
            min-height: 100vh;
            padding: 20px; /* Adicionado um pequeno padding para não colar nas bordas em telas muito pequenas */
        }

        /* Container Principal */
        .card {
            background-color: #181818;
            width: 100%;
            max-width: 440px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        /* Cabeçalho Roxo */
        .card-header {
            background-color: #6700e5; /* Roxo vibrante aproximado */
            color: #ffffff;
            padding: 16px 20px;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-align: center;
        }

        /* Corpo da Carteirinha */
        .card-body {
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Linha Superior (Foto e Logo) */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 24px;
        }

        .profile-container {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #6700e5;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .logo-container {
            max-width: 150px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .logo-img {

        /* Nome do Estudante */

            font-weight: 800;

            text-transform: uppercase;
            margin-bottom: 16px;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }

        /* Seções de Informações */
        .info-group {
            width: 100%;
            text-align: center;
            margin-bottom: 14px;
        }

        .info-label {
            color: #8c8c8c;
            font-size: 0.85rem;
            margin-bottom: 3px;
        }

        .info-value {
            color: #d1c4b2;
            font-weight: 700;
            font-size: 0.95rem;
        }

            text-transform: uppercase;

            width: 100%;

            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-code-img {
            width: 135px;
            height: 135px;
            display: block;
        }
    </style>
</head>

</body>
